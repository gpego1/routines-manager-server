server:
  port: 8080

spring:
  profiles:
    active: "dev"
    default: "none"
  config:
    import: optional:file:.env[.properties]
  application:
    name: routines
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show_sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
jwt:
  expiration: ${JWT_EXPIRATION}
  key: ${JWT_KEY}
telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN}
  bot-username: ${TELEGRAM_BOT_USERNAME}
  webhook-secret: ${TELEGRAM_WEBHOOK_SECRET}
  webhook-url: ${TELEGRAM_WEBHOOK_URL}
  api-base-url: ${TELEGRAM_API_BASE_URL}
  default-timezone: ${APP_TIMEZONE:America/Sao_Paulo}
  scheduler-enabled: ${TELEGRAM_SCHEDULER_ENABLED:true}
  scheduler-delay-ms: 30000
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /api-docs
    enabled: true
