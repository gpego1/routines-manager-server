spring:
  datasource:
    url: jdbc:h2:mem:routines;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    hibernate:
      ddl-auto: create-drop
jwt:
  key: routines-test-signing-key-at-least-32-bytes-long
  expiration: 3600000
telegram:
  bot-token: test-token
  bot-username: routines_test_bot
  webhook-secret: test-secret
  webhook-url: ''
  scheduler-enabled: false
